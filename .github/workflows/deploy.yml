name: OrionPay CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build com Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy (Restart do Serviço)
        run: |
          echo "🚀 Iniciando Deploy em /vagrant/services/orionpay-interchange-visa..."
          
          # 1. Define o diretório fixo onde está seu application.yml
          TARGET_DIR="/vagrant/services/orionpay-interchange-visa"
          
          # 2. Mata o processo atual na porta 8085
          sudo fuser -k 8085/tcp || true
          
          # 3. Copia o novo JAR para a pasta oficial (sobrescrevendo o antigo)
          cp orionpay-incoming-visa/target/*.jar $TARGET_DIR/app.jar
          
          # 4. Entra na pasta oficial ANTES de rodar
          # Isso é CRÍTICO para o Spring achar o application.yml local
          cd $TARGET_DIR
          
          # 5. Executa em background
          nohup java -jar app.jar > app.log 2>&1 &
          
          # 6. Pequena pausa para garantir que o processo descole do shell do runner
          sleep 5
          
          echo "✅ Serviço reiniciado com sucesso em $TARGET_DIR!"