name: OrionPay CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build com Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy (Restart do Serviço)
        run: |
          TARGET_DIR="/vagrant/services/orionpay-interchange-visa"
           cd $TARGET_DIR
          
           # 1. Mata qualquer processo anterior
           sudo fuser -k 8085/tcp || true
          
           # 2. Copia o JAR (garantindo que o usuário vagrant consiga escrever)
           cp orionpay-incoming-visa/target/*.jar ./app.jar
          
           # 3. O PULO DO GATO: Usa o 'setsid' para criar uma sessão totalmente nova
           # e o 'disown' para o shell não esperar por ele.
           setsid nohup java -jar app.jar > app.log 2>&1 &
          
           # 4. Aguarda 10 segundos para o Spring dar o 'boot' inicial
           sleep 10
          
           # 5. Validação em tempo real: Se o processo sumir agora, o erro vai para o log do GitHub
           if ps -ef | grep -v grep | grep "app.jar"; then
             echo "✅ PROCESSO IDENTIFICADO NO PS -EF!"
             sudo ss -tulpn | grep :8085 || echo "⚠️ Porta 8085 ainda não subiu, mas o processo existe."
           else
             echo "❌ ERRO: O processo Java morreu em menos de 10 segundos."
             echo "--- ÚLTIMAS LINHAS DO LOG ---"
             tail -n 20 app.log
             exit 1
           fi