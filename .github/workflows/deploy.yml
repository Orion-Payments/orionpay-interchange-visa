name: OrionPay CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build com Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy (Restart do Serviço)
        run: |
          TARGET_DIR="/vagrant/services/orionpay-interchange-visa"
           cd $TARGET_DIR
          
           # 1. Mata o que estiver na 8085 (seu alvo) e na 8080 (o que subiu errado)
           sudo fuser -k 8085/tcp || true
           sudo fuser -k 8080/tcp || true
          
           # 2. Copia o novo JAR do build para cá, renomeando para app.jar para facilitar
           cp orionpay-incoming-visa/target/orionpay-interchange-visa-*.jar ./app.jar
          
           # 3. Executa FORÇANDO o uso do application.yml que está na pasta
           nohup java -jar app.jar --spring.config.location=file:./application.yml > app.log 2>&1 &
          
           echo "🚀 Serviço reiniciado usando application.yml local!"