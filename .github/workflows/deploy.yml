name: OrionPay CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build com Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy (Restart do Serviço)
        run: |
          TARGET_DIR="/vagrant/services/orionpay-interchange-visa"
          cd $GITHUB_WORKSPACE
          
            echo "📂 Listando arquivos para encontrar o JAR..."
            # Este comando vai listar todos os JARs gerados para a gente ter certeza do caminho
            find . -name "*.jar" -path "*/target/*"
            
            # 1. Tenta copiar usando um padrão mais genérico
            # Vamos buscar em qualquer pasta target que contenha o JAR do projeto
            cp $(find . -name "orionpay-interchange-visa-*.jar" -path "*/target/*" | head -n 1) $TARGET_DIR/app.jar
            
            cd $TARGET_DIR
            sudo fuser -k 8085/tcp || true
            
            setsid nohup java -jar app.jar > app.log 2>&1 &
            disown
            
            sleep 10
            ps -ef | grep app.jar | grep -v grep
          
           # 5. Validação em tempo real: Se o processo sumir agora, o erro vai para o log do GitHub
           if ps -ef | grep -v grep | grep "app.jar"; then
             echo "✅ PROCESSO IDENTIFICADO NO PS -EF!"
             sudo ss -tulpn | grep :8085 || echo "⚠️ Porta 8085 ainda não subiu, mas o processo existe."
           else
             echo "❌ ERRO: O processo Java morreu em menos de 10 segundos."
             echo "--- ÚLTIMAS LINHAS DO LOG ---"
             tail -n 20 app.log
             exit 1
           fi